services:
  - type: web
    name: daily-trivia-backend
    env: python
    rootDir: apps/api
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.migrations.migrate_trivia_candidates && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SOCIAL_AUTOMATION_SECRET
        generateValue: true
      - key: SOCIAL_CONTENT_MODEL
        value: gpt-5.6-luna
      - key: SOCIAL_RESEARCH_MAX_SEARCH_CALLS
        value: "1"
      - key: SOCIAL_RESEARCH_SEARCH_CONTEXT_SIZE
        value: low
      - key: SOCIAL_INPUT_USD_PER_MILLION
        value: "0.20"
      - key: SOCIAL_OUTPUT_USD_PER_MILLION
        value: "1.20"
      - key: SOCIAL_WEB_SEARCH_USD_PER_1000
        value: "10.0"
      - key: SOCIAL_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: SOCIAL_IMAGE_QUALITY
        value: low
      - key: SOCIAL_TTS_ENABLED
        value: "true"
      - key: SOCIAL_BGM_URL
        sync: false
      - key: R2_SOCIAL_PREFIX
        value: social
      - key: SOCIAL_ASSET_R2_BASE_URL
        sync: false
      - key: SEEDANCE_API_KEY
        sync: false
      - key: SEEDANCE_MODEL
        sync: false
      - key: SOCIAL_X_PUBLISH_ENABLED
        value: "false"
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_USERNAME
        sync: false
      - key: SOCIAL_THREADS_PUBLISH_ENABLED
        value: "false"
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: TRIVIA_COLLECTION_MODEL
        value: gpt-5-mini
      - key: TRIVIA_DISCOVERY_DOMAINS
        value: zatsuneta.com,kerokero-info.com,zatsugaku-company.com,i-trivia.net,10zatsugaku.info,m-mom.net,memozaru.com,omoshiro-zatsugaku.com,omoshirozatsugaku.jp,chigai-allguide.com
      - key: TRIVIA_MAX_SEARCH_CALLS
        value: 5
      - key: TRIVIA_COLLECTION_ATTEMPTS
        value: 3
      - key: TRIVIA_SEARCH_CONTEXT_SIZE
        value: medium
      - key: DAILY_COLLECTION_COUNT
        value: 10
      - key: DAILY_COLLECTION_MAX_PENDING
        value: 30
      - key: DAILY_COLLECTION_MONTHLY_BUDGET_USD
        value: 6.0
      - key: DAILY_COLLECTION_SECRET
        sync: false
      - key: OPENAI_INPUT_USD_PER_MILLION
        value: 0.25
      - key: OPENAI_OUTPUT_USD_PER_MILLION
        value: 2.0
      - key: OPENAI_WEB_SEARCH_USD_PER_1000
        value: 10.0
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_IDS
        sync: false
      - key: CANDIDATE_EDITOR_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: MINIMUM_SUPPORTED_APP_VERSION
        sync: false
      - key: LATEST_APP_VERSION
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # Staging must use its own DATABASE_URL and APP_DATABASE_URL. Never copy the
  # production database URLs into this service: startup runs migrations.
  - type: web
    name: daily-trivia-backend-staging
    env: python
    rootDir: apps/api
    branch: develop
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.migrations.migrate_trivia_candidates && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SOCIAL_AUTOMATION_SECRET
        generateValue: true
      - key: SOCIAL_CONTENT_MODEL
        value: gpt-5.6-luna
      - key: SOCIAL_RESEARCH_MAX_SEARCH_CALLS
        value: "1"
      - key: SOCIAL_RESEARCH_SEARCH_CONTEXT_SIZE
        value: low
      - key: SOCIAL_INPUT_USD_PER_MILLION
        value: "0.20"
      - key: SOCIAL_OUTPUT_USD_PER_MILLION
        value: "1.20"
      - key: SOCIAL_WEB_SEARCH_USD_PER_1000
        value: "10.0"
      - key: SOCIAL_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: SOCIAL_IMAGE_QUALITY
        value: low
      - key: SOCIAL_TTS_ENABLED
        value: "true"
      - key: SOCIAL_BGM_URL
        sync: false
      - key: R2_SOCIAL_PREFIX
        value: staging/social
      - key: SOCIAL_ASSET_R2_BASE_URL
        sync: false
      - key: SEEDANCE_API_KEY
        sync: false
      - key: SEEDANCE_MODEL
        sync: false
      - key: SOCIAL_X_PUBLISH_ENABLED
        value: "false"
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_USERNAME
        sync: false
      - key: SOCIAL_THREADS_PUBLISH_ENABLED
        value: "false"
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: TRIVIA_DISCOVERY_DOMAINS
        value: zatsuneta.com,kerokero-info.com,zatsugaku-company.com,i-trivia.net,10zatsugaku.info,m-mom.net,memozaru.com,omoshiro-zatsugaku.com,omoshirozatsugaku.jp,chigai-allguide.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_IDS
        sync: false
      - key: CANDIDATE_EDITOR_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://daily-trivia-backend-staging.onrender.com
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TRIVIA_IMAGE_R2_BASE_URL
        sync: false
      - key: R2_TRIVIA_IMAGE_PREFIX
        value: staging
      - key: MINIMUM_SUPPORTED_APP_VERSION
        value: 0.0.0
      - key: LATEST_APP_VERSION
        value: 1.0.37
      - key: APP_STORE_URL
        value: https://apps.apple.com/app/id6758872525
      - key: PYTHON_VERSION
        value: 3.13.0
