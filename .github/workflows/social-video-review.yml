name: Social publishing

on:
  schedule:
    # GitHub Actions uses UTC. 01:17 UTC is 10:17 JST.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      text_only:
        description: "Publish only the daily X and Threads post"
        required: false
        type: boolean
        default: false

concurrency:
  group: social-video-review
  cancel-in-progress: false

jobs:
  create-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create and publish the daily X and Threads post
        env:
          SOCIAL_AUTOMATION_URL: ${{ vars.SOCIAL_AUTOMATION_URL }}
          SOCIAL_AUTOMATION_SECRET: ${{ secrets.DAILY_COLLECTION_SECRET }}
          TEXT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.text_only && 'true' || 'false' }}
        run: |
          test -n "$SOCIAL_AUTOMATION_URL"
          test -n "$SOCIAL_AUTOMATION_SECRET"
          response=$(curl --fail-with-body --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${SOCIAL_AUTOMATION_SECRET}" \
            "${SOCIAL_AUTOMATION_URL%/}/internal/social/run-due-text?force=${TEXT_FORCE}")
          echo "$response"
          echo "$response" | jq --exit-status '
            if .status == "review" then
              (.line_review.sent_at != null)
            else
              [.publish_jobs[]? | select(.platform == "x" or .platform == "threads")] as $jobs
              | ($jobs | length) == 2 and ($jobs | all(.status == "published"))
            end
          '

      - name: Create a due video and send it to LINE
        if: ${{ github.event_name == 'schedule' || !inputs.text_only }}
        env:
          SOCIAL_AUTOMATION_URL: ${{ vars.SOCIAL_AUTOMATION_URL }}
          SOCIAL_AUTOMATION_SECRET: ${{ secrets.DAILY_COLLECTION_SECRET }}
        run: |
          test -n "$SOCIAL_AUTOMATION_URL"
          test -n "$SOCIAL_AUTOMATION_SECRET"
          curl --fail-with-body --max-time 840 \
            --request POST \
            --header "Authorization: Bearer ${SOCIAL_AUTOMATION_SECRET}" \
            "${SOCIAL_AUTOMATION_URL%/}/internal/social/run-due"
